<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat4U - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="background-glow"></div>
    <div class="background-glow-left"></div>

    <div class="auth-container" style="max-width: 500px;">
        <div class="auth-header">
            <div class="bot-avatar">4U</div>
            <h1>Create Account</h1>
            <p>Join Chat4U and experience the future</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="johndoe4u" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" name="password" placeholder="••••••••" required>
                <button type="button" class="password-toggle" id="toggleRegPwdBtn" onclick="togglePassword('reg-password', 'toggleRegPwdBtn')">👁️</button>
                <div class="password-strength">
                    <div class="strength-bar" id="strength-bar"></div>
                </div>
                <span class="strength-text" id="strength-text"></span>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>
                <button type="button" class="password-toggle" id="toggleConfPwdBtn" onclick="togglePassword('confirm-password', 'toggleConfPwdBtn')">👁️</button>
            </div>

            <div class="auth-options" style="margin-top: -10px;">
                <label>
                    <input type="checkbox" name="terms" id="terms" required>
                    I agree to the Terms & Conditions
                </label>
            </div>

            <button type="submit" class="primary-btn" id="regBtn">Create Account</button>
            
            <div class="divider">or</div>
            
            <button type="button" class="google-btn" onclick="showToast('Google signup is coming soon!', 'error')">
                <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign up with Google
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/auth/login" class="auth-link">Login</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('fullName').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const terms = document.getElementById('terms').checked;
            
            if (!terms) return showToast('Please agree to the Terms', 'error');
            if (password !== confirm) return showToast('Passwords do not match', 'error');
            
            // Check strength
            const strength = checkPasswordStrength(password);
            if (strength < 100) return showToast('Password is not strong enough (Need uppercase, lowercase, number, symbol)', 'error');
            
            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.innerHTML = 'Creating Account...';
            
            try {
                const res = await fetch('/auth/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({full_name, username, email, password})
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showToast(data.message, 'success');
                    setTimeout(() => window.location.href = '/auth/login', 1500);
                } else {
                    showToast(data.message || 'Registration failed', 'error');
                }
            } catch (err) {
                showToast('Network error', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        });
    </script>
</body>
</html>
