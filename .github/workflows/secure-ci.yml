name: DevSecOps CI Pipeline

on:
  push:
    branches:
    - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .github/workflows/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r .github/workflows/requirements-dev.txt

      - name: Run flake8
        run: |
          flake8 . --ignore=E501,W291,W293,E302,E305


  build-and-push:
    needs: lint
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: |
          echo "sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chat4u:${{ steps.vars.outputs.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/chat4u:latest

  trivy:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-cache

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/chat4u:${{ needs.build-and-push.outputs.image_tag }}

      - name: Trivy JSON Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/chat4u:${{ needs.build-and-push.outputs.image_tag }}
          format: json
          output: trivy-report.json

      - name: Trivy SARIF Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/chat4u:${{ needs.build-and-push.outputs.image_tag }}
          format: sarif
          output: trivy-report.sarif

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-report.sarif

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.json
            trivy-report.sarif
          retention-days: 30

  bandit:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .github/workflows/requirements-dev.txt

      - run: |
          pip install -r .github/workflows/requirements-dev.txt

      - run: |
          bandit -r . -f json -o bandit-report.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  snyk:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/chat4u:${{ needs.build-and-push.outputs.image_tag }}

      - uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/chat4u:${{ needs.build-and-push.outputs.image_tag }}
          args: --json-file-output=snyk-report.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
          retention-days: 30

