name: CI/CD Pipeline

on:
  push:
    branches:
      - kartik
  pull_request:
    branches:
      - kartik

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

  release-and-publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/kartik'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          DEFAULT_BRANCH: kartik

      - name: Create Clean Tag Output
        id: meta
        run: |
          CLEAN_TAG=$(echo "${{ steps.tag_version.outputs.new_tag }}" | sed 's/^v//')
          echo "clean_tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT

      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LC=${REPO,,}" >> ${GITHUB_ENV}
        env:
          REPO: '${{ github.repository }}'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ steps.tag_version.outputs.new_tag }}
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}

      - name: Build local image for archiving
        run: |
          docker build -t ghcr.io/${{ env.REPO_LC }}:${{ steps.tag_version.outputs.new_tag }} .
          docker save -o local-flask-app-${{ steps.meta.outputs.clean_tag }}-image.tar ghcr.io/${{ env.REPO_LC }}:${{ steps.tag_version.outputs.new_tag }}

      # Save the generated file before the temporary runner self-destructs
      - name: Upload Container Tarball Archive to GitHub Storage
        uses: actions/upload-artifact@v4
        with:
          name: flask-production-package-${{ steps.meta.outputs.clean_tag }}
          # Path must match what the Makefile generates: [IMAGE_NAME]-[VERSION].tar
          path: local-flask-app-${{ steps.meta.outputs.clean_tag }}-*.tar
          retention-days: 7 # Kept for a week before auto-pruning to save cloud space
