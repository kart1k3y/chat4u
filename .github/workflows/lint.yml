name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .github/workflows/requirements-dev.txt

      - name: Install linter
        run: |
          pip install -r .github/workflows/requirements-dev.txt

      - name: Run flake8
        run: |
          flake8 . --ignore=E501,W291,W293,E302,E305