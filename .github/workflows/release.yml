name: Release Pipeline

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with 'v', e.g., v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for generating complete release notes/changelogs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Replace 'chat4u' with your actual image name if different
          images: ${{ secrets.DOCKER_USERNAME }}/chat4u
          tags: |
            # Tags the image with the semantic version (e.g., 1.0.0)
            type=semver,pattern={{version}}
            # Tags the image with the short git commit SHA
            type=sha,format=short
            # Adds the 'latest' tag automatically
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Automatically generates a changelog based on pull requests and commits since the last tag
          generate_release_notes: true
