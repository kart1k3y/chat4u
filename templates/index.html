<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} - Dashboard & Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        /* Existing Chat CSS inside the new auth wrapper */
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            max-height: 700px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 1;
            overflow: hidden;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: none; /* Hidden until "Enter Chat" is clicked */
        }
        
        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(17, 24, 39, 0.3);
        }
        
        .header-info { display: flex; align-items: center; gap: 12px; }
        .header-text h1 { font-size: 1.1rem; font-family: 'Outfit', sans-serif; font-weight: 600; }
        .status-container { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .status-dot { width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }
        .status-text { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
        .badge { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 12px; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; cursor: pointer; transition: all 0.2s;}
        .badge:hover { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: rgba(239, 68, 68, 0.5); }
        
        .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.1); border-radius: 3px; }
        .message { max-width: 80%; display: flex; flex-direction: column; gap: 4px; animation: messageSlideIn 0.3s forwards; }
        @keyframes messageSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; }
        .message-content { padding: 12px 18px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; }
        .bot .message-content { background: rgba(31, 41, 55, 0.8); border: 1px solid var(--border-color); border-top-left-radius: 4px; color: var(--text-main); }
        .user .message-content { background: linear-gradient(135deg, var(--primary), #3b82f6); border-top-right-radius: 4px; color: white; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.2); }
        .message-time { font-size: 0.7rem; color: var(--text-muted); padding: 0 4px; }
        .bot .message-time { align-self: flex-start; }
        .user .message-time { align-self: flex-end; }
        
        .chat-input-area { padding: 20px 24px; border-top: 1px solid var(--border-color); background: rgba(17, 24, 39, 0.3); display: flex; gap: 12px; }
        .input-wrapper { flex: 1; position: relative; }
        .input-wrapper input { width: 100%; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color); padding: 14px 20px; border-radius: 14px; color: white; font-size: 0.95rem; outline: none; }
        .input-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }
        .chat-input-area button { background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; color: white; padding: 0 24px; border-radius: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .chat-input-area button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4); }
        
        /* Dashboard Container */
        .dashboard-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 1;
            text-align: center;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .user-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 2.5rem;
            color: white;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
            border: 3px solid rgba(255,255,255,0.1);
        }

        .dashboard-container h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .dashboard-container h3 {
            color: var(--secondary);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .last-login {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            background: rgba(0,0,0,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Loading Spinner */
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <div class="background-glow-left"></div>

    <!-- Loading State -->
    <div id="loading" style="z-index: 10;"><div class="loader"></div></div>

    <!-- Dashboard State -->
    <div class="dashboard-container" id="dashboard" style="display: none;">
        <div class="user-avatar-large" id="dashAvatar">?</div>
        <h1 id="dashWelcome">Welcome</h1>
        <h3 id="dashUsername">@username</h3>
        <div class="last-login" id="dashLastLogin">Last login: Unknown</div>
        
        <button class="primary-btn" onclick="enterChat()" style="margin-bottom: 15px;">
            <svg style="margin-right:8px;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Enter Chat
        </button>
        <button class="google-btn" onclick="logout()">Logout</button>
    </div>

    <!-- Chat State -->
    <div class="chat-container" id="chat">
        <div class="chat-header">
            <div class="header-info">
                <div class="bot-avatar">4U</div>
                <div class="header-text">
                    <h1>{{ app_name }}</h1>
                    <div class="status-container">
                        <div class="status-dot"></div>
                        <span class="status-text">Authenticated</span>
                    </div>
                </div>
            </div>
            <div class="badge" onclick="logout()">LOGOUT</div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                <div class="message-content">
                    Secure session established! Ask me anything.
                </div>
                <span class="message-time">Just now</span>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
            </div>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        const token = localStorage.getItem('chat4u_token');
        
        async function initAuth() {
            if (!token) {
                window.location.href = '/auth/login';
                return;
            }
            
            try {
                const res = await fetch('/auth/api/user', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    
                    document.getElementById('loading').style.display = 'none';
                    
                    // Show chat immediately
                    document.getElementById('chat').style.display = 'flex';
                    
                    // Optionally update a header element if desired, but we bypass the dashboard
                    // document.getElementById('dashWelcome').innerText = `Welcome back, ${data.full_name.split(' ')[0]}!`;
                    // document.getElementById('dashUsername').innerText = `@${data.username}`;
                    // document.getElementById('dashAvatar').innerText = data.full_name.charAt(0).toUpperCase();
                    
                    if(data.last_login) {
                        const date = new Date(data.last_login);
                        document.getElementById('dashLastLogin').innerText = `Last login: ${date.toLocaleString()}`;
                    }
                } else {
                    // Invalid token
                    localStorage.removeItem('chat4u_token');
                    window.location.href = '/auth/login';
                }
            } catch (err) {
                console.error(err);
                showToast("Connection error", "error");
            }
        }
        
        function enterChat() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('chat').style.display = 'flex';
        }
        
        function logout() {
            localStorage.removeItem('chat4u_token');
            window.location.href = '/auth/login';
        }

        // Chat logic
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            const timeSpan = document.createElement('span');
            timeSpan.className = 'message-time';
            timeSpan.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.appendChild(contentDiv);
            messageDiv.appendChild(timeSpan);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleSend() {
            const message = chatInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            chatInput.value = '';
            
            chatInput.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ message })
                });
                
                if (response.status === 401 || response.status === 422) {
                    showToast("Session expired", "error");
                    setTimeout(logout, 1500);
                    return;
                }
                
                if (response.status === 429) {
                    appendMessage("Rate limit exceeded. Please wait a moment.", 'bot');
                } else {
                    const data = await response.json();
                    appendMessage(data.response, 'bot');
                }
            } catch (error) {
                appendMessage("Sorry, connection error.", 'bot');
            } finally {
                chatInput.disabled = false;
                sendBtn.disabled = false;
                chatInput.focus();
            }
        }

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });

        // Initialize App
        window.addEventListener('load', initAuth);
    </script>
</body>
</html>
