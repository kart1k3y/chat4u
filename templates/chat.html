<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Chat4U</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
</head>
<body>
    <div class="background-glow"></div>
    <div class="background-glow-left"></div>

    <div class="app-container">
        <!-- Sidebar Panel -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Chats</h2>
                <input type="text" class="search-bar" placeholder="Search users or groups...">
            </div>
            
            <div class="sidebar-content">
                <div class="section-title">Direct Messages</div>
                <div id="users-list">
                    <!-- Users injected here by chat.js -->
                </div>

                <div class="section-title" style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <span>Groups</span>
                    <button id="new-group-btn" class="new-group-btn" title="Create New Group">+</button>
                </div>
                <div id="groups-list">
                    <!-- Groups injected here by chat.js -->
                </div>
            </div>
        </div>

        <!-- Chat Area Panel -->
        <div class="chat-area">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-info" style="cursor: pointer;" id="chat-header-info">
                    <div class="header-text">
                        <h1 id="chat-header-title">Select a chat</h1>
                        <div class="status-container">
                            <span class="status-text" id="chat-status-text">...</span>
                        </div>
                    </div>
                </div>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>

            <!-- Empty State -->
            <div id="no-chat-selected" class="no-chat-selected">
                <h2>Welcome to Chat4U</h2>
                <p>Select a contact or group from the sidebar to start messaging</p>
            </div>

            <!-- Messages Area -->
            <div class="chat-messages" id="chat-messages">
                <!-- Messages injected here by chat.js -->
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <button class="attachment-btn" id="attachment-btn" title="Attach file">📎</button>
                <div class="input-wrapper">
                    <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                </div>
                <button id="send-btn" class="send-btn">Send</button>
            </div>
        </div>

        <!-- Group Info Side Panel (Person 3) -->
        <div class="group-info-panel" id="group-info-panel">
            <div class="panel-header">
                <h3>Group Info</h3>
                <button id="close-group-info-btn" class="close-btn">&times;</button>
            </div>
            <div class="panel-content">
                <h4 id="group-info-name">Group Name</h4>
                <div class="section-title" style="padding-left: 0;">Members</div>
                <div class="add-member-container" style="display: flex; gap: 8px; margin-top: 5px;">
                    <select id="add-member-select" style="flex: 1; padding: 6px; border-radius: 6px; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border-color); font-size: 0.85rem; outline: none;">
                        <option value="">Select user...</option>
                    </select>
                    <button id="add-member-submit-btn" style="background: var(--primary); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: background 0.2s ease;">Add</button>
                </div>
                <div id="group-members-list" class="members-list">
                    <!-- Members injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden File Input for Image Upload (Person 3) -->
    <input type="file" id="media-file-input" accept="image/png, image/jpeg, image/gif, image/webp" style="display: none;">

    <!-- Lightbox Modal (Person 3) -->
    <div id="lightbox-modal" class="modal lightbox-modal">
        <span class="close-lightbox" id="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Enlarged Image">
        <div id="lightbox-caption"></div>
    </div>

    <!-- Create Group Modal (Person 3) -->
    <div id="group-modal" class="modal group-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Group</h2>
                <span class="close-modal" id="close-group-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="group-name-input">Group Name</label>
                    <input type="text" id="group-name-input" placeholder="Enter group name..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Select Members</label>
                    <input type="text" id="member-search-input" placeholder="Search users..." autocomplete="off">
                    <div id="member-select-list" class="member-select-list">
                        <!-- User list with checkboxes -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-group-btn" class="btn btn-secondary">Cancel</button>
                <button id="submit-group-btn" class="btn btn-primary">Create Group</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
