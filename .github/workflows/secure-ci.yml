  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    needs:
      - trivy
      - snyk
      - bandit
      # - zap

    steps:
      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-report
          path: reports/trivy

      - name: Download Snyk Report
        uses: actions/download-artifact@v4
        with:
          name: snyk-report
          path: reports/snyk

      - name: Download Bandit Report
        uses: actions/download-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit

      # - name: Download ZAP Report
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: zap-report
      #     path: reports/zap

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Evaluate Security Findings
        run: |
          HIGH=0
          CRITICAL=0

          echo "===== Trivy ====="

          if [ -f reports/trivy/trivy-report.json ]; then
            TRIVY_HIGH=$(jq '[.. | objects | select(.Severity?=="HIGH")] | length' reports/trivy/trivy-report.json)
            TRIVY_CRITICAL=$(jq '[.. | objects | select(.Severity?=="CRITICAL")] | length' reports/trivy/trivy-report.json)

            HIGH=$((HIGH + TRIVY_HIGH))
            CRITICAL=$((CRITICAL + TRIVY_CRITICAL))

            echo "Trivy HIGH: $TRIVY_HIGH"
            echo "Trivy CRITICAL: $TRIVY_CRITICAL"
          else
            echo "Trivy report not found"
          fi

          echo "===== Snyk ====="

          if [ -f reports/snyk/snyk-report.json ]; then
            SNYK_HIGH=$(jq '[.. | objects | select(.severity?=="high")] | length' reports/snyk/snyk-report.json)
            SNYK_CRITICAL=$(jq '[.. | objects | select(.severity?=="critical")] | length' reports/snyk/snyk-report.json)

            HIGH=$((HIGH + SNYK_HIGH))
            CRITICAL=$((CRITICAL + SNYK_CRITICAL))

            echo "Snyk HIGH: $SNYK_HIGH"
            echo "Snyk CRITICAL: $SNYK_CRITICAL"
          else
            echo "Snyk report not found"
          fi

          echo "===== Bandit ====="

          if [ -f reports/bandit/bandit-report.json ]; then
            BANDIT_HIGH=$(jq '[.results[] | select(.issue_severity=="HIGH")] | length' reports/bandit/bandit-report.json)

            HIGH=$((HIGH + BANDIT_HIGH))

            echo "Bandit HIGH: $BANDIT_HIGH"
          else
            echo "Bandit report not found"
          fi

          # ===== ZAP (Enable Later) =====
          #
          # if [ -f reports/zap/zap-report.json ]; then
          #   ZAP_HIGH=$(jq '...' reports/zap/zap-report.json)
          #   HIGH=$((HIGH + ZAP_HIGH))
          #   echo "ZAP HIGH: $ZAP_HIGH"
          # fi

          echo ""
          echo "=============================="
          echo "TOTAL HIGH: $HIGH"
          echo "TOTAL CRITICAL: $CRITICAL"
          echo "=============================="

          if [ "$HIGH" -gt 1000 ] || [ "$CRITICAL" -gt 100 ]; then
            echo "❌ Security Gate Failed"
            exit 1
          fi

          echo "✅ Security Gate Passed"
