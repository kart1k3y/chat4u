<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat4U - Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="background-glow"></div>
    <div class="background-glow-left"></div>

    <div class="auth-container">
        <div class="auth-header">
            <div class="bot-avatar">4U</div>
            <h1>Reset Password</h1>
            <p>Enter your email to receive a reset link</p>
        </div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>

            <button type="submit" class="primary-btn" id="resetBtn">Send Reset Link</button>
        </form>

        <div class="auth-footer" style="margin-top: 30px;">
            Remember your password? <a href="/auth/login" class="auth-link">Return to Login</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('resetBtn');
            
            btn.disabled = true;
            btn.innerHTML = 'Sending...';
            
            try {
                const res = await fetch('/auth/api/forgot-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email})
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showToast(data.message, 'success');
                    // Change form to success state
                    document.getElementById('forgotForm').innerHTML = `
                        <div style="text-align: center; color: var(--accent); margin-bottom: 20px;">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                            <h3 style="color: white; margin-top: 10px;">Check your email</h3>
                        </div>
                        <a href="/auth/login" class="primary-btn" style="text-decoration: none;">Return to Login</a>
                    `;
                } else {
                    showToast(data.message || 'Error sending request', 'error');
                }
            } catch (err) {
                showToast('Network error', 'error');
            } finally {
                if(document.getElementById('resetBtn')) {
                    btn.disabled = false;
                    btn.innerHTML = 'Send Reset Link';
                }
            }
        });
    </script>
</body>
</html>
